# SonarQube Project Configuration for SIMAG BMKG
sonar.projectKey=simag-bmkg-web
sonar.projectName=SIMAG BMKG Web
sonar.projectVersion=0.1.0

# Encoding
sonar.sourceEncoding=UTF-8

# Source Code & Test File Paths
sonar.sources=src
sonar.tests=tests

# File Inclusion / Exclusion
sonar.inclusions=src/**/*.ts,src/**/*.tsx,src/**/*.js
sonar.test.inclusions=tests/**/*.ts,tests/**/*.tsx,tests/**/*.js

# Exclude generated code, dependencies, and build outputs
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/public/**,**/coverage/**,**/*.config.ts,**/*.config.mjs,**/scripts/**,**/prisma/**

# Test execution and coverage report paths
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Duplication exclusion
sonar.cpd.exclusions=tests/**,src/**

# Ignore stylistic maintainability rules on baseline code
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6606
sonar.issue.ignore.multicriteria.e1.resourceKey=src/**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.e2.resourceKey=src/**/*
