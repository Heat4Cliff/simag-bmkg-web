# SonarQube Project Configuration for SIMAG BMKG
sonar.projectKey=simag-bmkg-web
sonar.projectName=SIMAG BMKG Web
sonar.projectVersion=0.1.0

# Encoding
sonar.sourceEncoding=UTF-8

# Source Code & Test File Paths
sonar.sources=src
sonar.tests=tests

# File Inclusion / Exclusion
sonar.inclusions=src/**/*.ts,src/**/*.tsx,src/**/*.js
sonar.test.inclusions=tests/**/*.ts,tests/**/*.tsx,tests/**/*.js

# Exclude generated code, dependencies, and build outputs
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/public/**,**/coverage/**,**/*.config.ts,**/*.config.mjs,**/scripts/**,**/prisma/**

# Test execution and coverage report paths
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Browser pages/components are covered by the Playwright suite, whose execution
# format is not LCOV. The Node-based LCOV gate therefore measures the testable
# core business layer; all source files remain included in static analysis.
sonar.coverage.exclusions=src/app/**,src/components/**,src/middleware.ts,src/types/**

# The scanner must wait for the server-side Quality Gate. This makes failed
# coverage/reliability/security gates fail the local or CI quality command.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Duplication exclusion
sonar.cpd.exclusions=tests/**,src/app/**/page.tsx,src/app/api/**
