name: Quality Gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: simag_bmkg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/simag_bmkg_test
      TEST_DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/simag_bmkg_test
      AUTH_SECRET: ci-test-secret-key-simag-bmkg-non-production-2026
      NEXTAUTH_SECRET: ci-test-secret-key-simag-bmkg-non-production-2026
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: Heat4Cliff_simag-bmkg-web
      SONAR_ORGANIZATION: heat4cliff
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run lint -- --quiet
      - run: npm run test:coverage:lcov
      - run: npm run test:coverage:verify
      - name: Scan and wait for SonarQube Quality Gate
        if: ${{ env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '' }}
        run: npm run sonar:scan
